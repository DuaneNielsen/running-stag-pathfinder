name: windows-smoke

# Pathfinder for the running-stag install: does a Claude Code mod launch mise (mise.cmd on Windows) and fetch a
# Bearer-gated binary on a clean runner? The "binary" is a real small executable (whoami) packed into a local
# release served by tools/authsrv.py, so the launcher and mod mechanics are the thing under test, not Frontier.
# Modeled on the install-smoke stages (clean slate, native Claude install, detuned Windows baseline).
# The mod runs at session start even with no model login, so no Claude secret is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: "smoke (${{ matrix.os }}${{ matrix.detune && ' detuned' || '' }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  detune: false }
          - { os: windows-latest, detune: false }
          - { os: windows-latest, detune: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code (native installer)
        run: |
          if ($IsWindows) {
            irm https://claude.ai/install.ps1 | iex
            "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            bash -c 'curl -fsSL https://claude.ai/install.sh | bash'
            "$HOME/.local/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: "De-tune: strip Node and Bun from PATH (windows pilot baseline)"
        if: matrix.detune
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -notmatch 'node') -and ($_ -notmatch 'bun') }) -join ';'
          foreach ($t in 'node','bun') {
            while ($cmd = Get-Command $t -ErrorAction SilentlyContinue) {
              $dir = Split-Path $cmd.Source -Parent
              $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -ne $dir) }) -join ';'
            }
          }
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($t in 'node','bun') { if (Get-Command $t -ErrorAction SilentlyContinue) { Write-Host "FAIL: $t still on PATH"; exit 1 } }
          Write-Host "pilot baseline: no node, no bun"

      - name: claude --version
        run: claude --version

      - name: Build a local gated release (a real small executable) and its stub
        run: |
          $rel = Join-Path $env:RUNNER_TEMP 'rel'
          $pkg = Join-Path $rel 'pkg'
          New-Item -ItemType Directory -Force -Path (Join-Path $pkg 'bin') | Out-Null
          if ($IsWindows) {
            Copy-Item "$env:SystemRoot\System32\whoami.exe" (Join-Path $pkg 'bin\frontier.exe')
            $plat = 'windows-x64'; $archive = 'frontier-0.1.56-windows-x64.zip'
            Compress-Archive -Path (Join-Path $pkg '*') -DestinationPath (Join-Path $rel $archive)
          } else {
            Copy-Item /usr/bin/whoami (Join-Path $pkg 'bin/frontier')
            $plat = 'linux-x64'; $archive = 'frontier-0.1.56-linux-x64.tar.gz'
            tar -czf (Join-Path $rel $archive) -C $pkg .
          }
          $sha = (Get-FileHash (Join-Path $rel $archive) -Algorithm SHA256).Hash.ToLower()
          $stub = @"
          version = "0.1.56"
          tool = "http:frontier"
          bin = "bin/frontier"
          headers = { Authorization = "Bearer {{ env.FRONTIER_TOKEN }}" }

          [platforms.$plat]
          url = "http://127.0.0.1:8799/$archive"
          checksum = "sha256:$sha"
          "@ -replace '(?m)^ {10}', ''
          Set-Content -Path plugin/bin/frontier.stub -Value $stub -Encoding utf8NoBOM
          Get-Content plugin/bin/frontier.stub
          "REL=$rel" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Start the Bearer-gated host
        run: |
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          $log = Join-Path $env:RUNNER_TEMP 'authsrv.log'
          Start-Process -FilePath $py -ArgumentList @('tools/authsrv.py', $env:REL, '8799') -RedirectStandardError $log -NoNewWindow
          Start-Sleep -Seconds 3
          "AUTHLOG=$log" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          try { Invoke-WebRequest -Uri http://127.0.0.1:8799/ -UseBasicParsing | Out-Null } catch { Write-Host "no-token probe: $($_.Exception.Response.StatusCode)" }

      - name: Isolate Claude config
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP 'cfg'
          New-Item -ItemType Directory -Force -Path $cfg | Out-Null
          "CLAUDE_CONFIG_DIR=$cfg" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install the plugin from this checkout (dummy token)
        run: |
          claude plugin validate plugin
          claude plugin install frontier --marketplace $PWD --config beta_token=beta-secret
          claude plugin list

      - name: Is the gated host alive after its own step?
        continue-on-error: true
        run: |
          Get-Process | Where-Object { $_.ProcessName -match 'python' } | Select-Object Id, ProcessName | Format-Table | Out-String | Write-Host
          Write-Host "release dir:"; Get-ChildItem $env:REL | Select-Object Name, Length | Format-Table | Out-String | Write-Host
          $arch = (Get-ChildItem $env:REL -File | Select-Object -First 1).Name
          curl.exe -sS -v -o NUL -H "Authorization: Bearer beta-secret" "http://127.0.0.1:8799/$arch" 2>&1 | Select-Object -First 25
          Write-Host "--- host log"; Get-Content $env:AUTHLOG

      - name: Run the mod's exact command by hand, verbose (diagnosis)
        continue-on-error: true
        run: |
          $env:FRONTIER_TOKEN = 'beta-secret'
          $env:MISE_VERBOSE = '1'
          $bin = if ($IsWindows) { "$PWD\plugin\bin\mise.cmd" } else { "$PWD/plugin/bin/mise" }
          Write-Host "using $bin"
          Get-Content plugin/bin/frontier.stub
          & $bin tool-stub "$PWD/plugin/bin/frontier.stub" --help 2>&1 | Select-Object -First 80
          Write-Host "exit: $LASTEXITCODE"
          Remove-Item Env:MISE_VERBOSE; Remove-Item Env:FRONTIER_TOKEN

      - name: Start a session (no model login needed; the mod runs at session start)
        continue-on-error: true
        run: |
          claude -p "hi" --debug-file (Join-Path $env:RUNNER_TEMP 'claude-debug.log')

      - name: Wait for the gated download and assert it
        run: |
          $deadline = (Get-Date).AddSeconds(240)
          $found = $null
          while ((Get-Date) -lt $deadline -and -not $found) {
            Start-Sleep -Seconds 5
            $roots = @("$env:LOCALAPPDATA\mise", "$HOME/.local/share/mise", "$HOME\AppData\Local\mise") | Where-Object { $_ -and (Test-Path $_) }
            foreach ($r in $roots) {
              $f = Get-ChildItem -Path (Join-Path $r 'installs') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in 'frontier','frontier.exe' } | Select-Object -First 1
              if ($f) { $found = $f.FullName; break }
            }
          }
          Write-Host "--- gated host log"; Get-Content $env:AUTHLOG -ErrorAction SilentlyContinue
          if (-not $found) { Write-Host "FAIL: no frontier binary under mise installs after 240s"; exit 1 }
          Write-Host "PASS: binary installed at $found"
          if (-not (Select-String -Path $env:AUTHLOG -Pattern 'auth=ok' -Quiet)) { Write-Host "FAIL: no authenticated request reached the host"; exit 1 }
          Write-Host "PASS: an authenticated request reached the host"

      - name: Run frontier through the plugin's bin wrapper (no token set)
        run: |
          Remove-Item Env:FRONTIER_TOKEN -ErrorAction SilentlyContinue
          if ($IsWindows) { & "$PWD\plugin\bin\frontier.cmd" } else { & "$PWD/plugin/bin/frontier" }
          if ($LASTEXITCODE -ne 0) { Write-Host "FAIL: wrapper exited $LASTEXITCODE"; exit 1 }
          Write-Host "PASS: wrapper ran the cached executable"

      - name: Diagnostics (always)
        if: always()
        run: |
          Write-Host "--- claude debug log (mod/hook lines)"
          Get-Content (Join-Path $env:RUNNER_TEMP 'claude-debug.log') -ErrorAction SilentlyContinue | Select-String -Pattern 'mod|hook|process|frontier|register|mise' | Select-Object -First 80
          Write-Host "--- gated host log"; Get-Content $env:AUTHLOG -ErrorAction SilentlyContinue
          Write-Host "--- mise dirs"
          foreach ($r in @("$env:LOCALAPPDATA\mise", "$HOME/.local/share/mise")) { if ($r -and (Test-Path $r)) { Write-Host $r; Get-ChildItem $r -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 30 -ExpandProperty FullName } }
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}${{ matrix.detune && '-detuned' || '' }}
          path: |
            ${{ runner.temp }}/claude-debug.log
            ${{ runner.temp }}/authsrv.log
          if-no-files-found: ignore
