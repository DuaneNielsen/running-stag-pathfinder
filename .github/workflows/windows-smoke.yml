name: windows-smoke

# Pathfinder for the running-stag install: does a Claude Code mod launch mise (mise.cmd on Windows) and fetch a
# Bearer-gated binary on a clean runner? The "binary" is a real small executable (whoami) packed into a local
# release served by tools/authsrv.py, so the launcher and mod mechanics are the thing under test, not Frontier.
# Modeled on the install-smoke stages (clean slate, native Claude install, detuned Windows baseline).
# The mod runs at session start even with no model login, so no Claude secret is needed.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: "smoke (${{ matrix.os }}${{ matrix.detune && ' detuned' || '' }}${{ matrix.nobash && ' no-bash' || '' }})"
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  detune: false }
          - { os: windows-latest, detune: false }
          - { os: windows-latest, detune: true }
          - { os: windows-latest, detune: true, nobash: true }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code (native installer)
        run: |
          if ($IsWindows) {
            irm https://claude.ai/install.ps1 | iex
            "$env:USERPROFILE\.local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          } else {
            bash -c 'curl -fsSL https://claude.ai/install.sh | bash'
            "$HOME/.local/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }

      - name: "De-tune: strip Node and Bun from PATH (windows pilot baseline)"
        if: matrix.detune
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -notmatch 'node') -and ($_ -notmatch 'bun') }) -join ';'
          foreach ($t in 'node','bun') {
            while ($cmd = Get-Command $t -ErrorAction SilentlyContinue) {
              $dir = Split-Path $cmd.Source -Parent
              $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -ne $dir) }) -join ';'
            }
          }
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          foreach ($t in 'node','bun') { if (Get-Command $t -ErrorAction SilentlyContinue) { Write-Host "FAIL: $t still on PATH"; exit 1 } }
          Write-Host "pilot baseline: no node, no bun"

      - name: "De-tune further: remove Git for Windows (bash, sh) from PATH; System32 stays (curl.exe, cmd.exe, WSL's bash.exe stub)"
        if: matrix.nobash
        run: |
          $env:PATH = (($env:PATH -split ';') | Where-Object { $_ -and ($_ -notmatch '(?i)\\Git\\') }) -join ';'
          "PATH=$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $sh = Get-Command sh -CommandType Application -ErrorAction SilentlyContinue
          $bash = Get-Command bash -CommandType Application -ErrorAction SilentlyContinue
          if ($sh) { Write-Host "FAIL: sh still on PATH at $($sh.Source)"; exit 1 }
          if ($bash) { Write-Host "bash left on PATH: $($bash.Source) (the WSL launcher stub, present on any Windows with WSL)" }
          foreach ($t in 'curl.exe', 'cmd.exe') { if (-not (Get-Command $t -ErrorAction SilentlyContinue)) { Write-Host "FAIL: $t missing"; exit 1 } }
          Write-Host "no Git for Windows, no node, no bun; curl.exe and cmd.exe present"

      - name: claude --version
        run: claude --version

      # One step on purpose: a background server started in one step does not survive into the next on a runner
      # (Windows kills it at the step's end; on Linux its stderr pipe closes with the step).
      - name: Journey (gated release, plugin install, session, download, wrapper)
        run: |
          $ErrorActionPreference = 'Stop'
          $tmp = $env:RUNNER_TEMP
          $rel = Join-Path $tmp 'rel'; $pkg = Join-Path $tmp 'pkg'
          New-Item -ItemType Directory -Force -Path $rel, $pkg | Out-Null
          # Same shape as the real release: one top-level directory holding bin/ and share/ (mise strips a lone top-level directory).
          if ($IsWindows) {
            $plat = 'windows-x64'; $archive = 'frontier-0.1.56-windows-x64.zip'; $top = Join-Path $pkg 'frontier-0.1.56-windows-x64'
            New-Item -ItemType Directory -Force -Path (Join-Path $top 'bin'), (Join-Path $top 'share') | Out-Null
            Copy-Item "$env:SystemRoot\System32\whoami.exe" (Join-Path $top 'bin\frontier.exe')
            Set-Content -Path (Join-Path $top 'share\README.txt') -Value 'payload'
            Compress-Archive -Path $top -DestinationPath (Join-Path $rel $archive)
          } else {
            $plat = 'linux-x64'; $archive = 'frontier-0.1.56-linux-x64.tar.gz'; $top = Join-Path $pkg 'frontier-0.1.56-linux-x64'
            New-Item -ItemType Directory -Force -Path (Join-Path $top 'bin'), (Join-Path $top 'share') | Out-Null
            Copy-Item /usr/bin/whoami (Join-Path $top 'bin/frontier')
            Set-Content -Path (Join-Path $top 'share/README.txt') -Value 'payload'
            tar -czf (Join-Path $rel $archive) -C $pkg frontier-0.1.56-linux-x64
          }
          $sha = (Get-FileHash (Join-Path $rel $archive) -Algorithm SHA256).Hash.ToLower()
          $binline = if ($IsWindows) { 'bin = "bin\\frontier.exe"' } else { '' }
          $stub = "version = `"0.1.56`"`ntool = `"http:frontier`"`nbin = `"bin/frontier`"`nheaders = { Authorization = `"Bearer {{ env.FRONTIER_TOKEN }}`" }`n`n[platforms.$plat]`nurl = `"http://127.0.0.1:8799/$archive`"`nchecksum = `"sha256:$sha`"`n$binline`n"
          Set-Content -Path plugin/bin/frontier.stub -Value $stub -Encoding utf8NoBOM -NoNewline
          Get-Content plugin/bin/frontier.stub

          $authlog = Join-Path $tmp 'authsrv.log'
          $py = if ($IsWindows) { 'python' } else { 'python3' }
          $srv = Start-Process -FilePath $py -ArgumentList @('tools/authsrv.py', $rel, '8799', $authlog) -PassThru
          try {
            Start-Sleep -Seconds 3
            try { Invoke-WebRequest -Uri "http://127.0.0.1:8799/$archive" -UseBasicParsing | Out-Null } catch { Write-Host "no-token probe refused: $($_.Exception.Message)" }
            $r = Invoke-WebRequest -Uri "http://127.0.0.1:8799/$archive" -Headers @{ Authorization = 'Bearer beta-secret' } -UseBasicParsing
            Write-Host "host check with token: $($r.StatusCode), $($r.RawContentLength) bytes"

            $cfg = Join-Path $tmp 'cfg'; New-Item -ItemType Directory -Force -Path $cfg | Out-Null
            $env:CLAUDE_CONFIG_DIR = $cfg
            claude plugin validate plugin
            claude plugin install frontier --marketplace $PWD --config beta_token=beta-secret
            claude plugin list

            Write-Host "--- start a session (no model login needed; the mod runs at session start)"
            $dbg = Join-Path $tmp 'claude-debug.log'
            claude -p "hi" --debug-file $dbg
            Write-Host "claude exit: $LASTEXITCODE (1 is expected: not logged in)"

            $deadline = (Get-Date).AddSeconds(240); $found = $null
            while ((Get-Date) -lt $deadline -and -not $found) {
              Start-Sleep -Seconds 5
              foreach ($root in @("$env:LOCALAPPDATA\mise", "$HOME/.local/share/mise")) {
                if ($root -and (Test-Path (Join-Path $root 'installs'))) {
                  $f = Get-ChildItem -Path (Join-Path $root 'installs') -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -in 'frontier','frontier.exe' } | Select-Object -First 1
                  if ($f) { $found = $f.FullName; break }
                }
              }
            }
            Write-Host "--- gated host log"; Get-Content $authlog
            if (-not $found) { throw "FAIL: no frontier binary under mise installs after 240s" }
            Write-Host "PASS: binary installed at $found"
            if (-not (Select-String -Path $authlog -Pattern 'auth=ok' -Quiet)) { throw "FAIL: no authenticated request reached the host" }
            Write-Host "PASS: an authenticated request reached the host"

            Remove-Item Env:FRONTIER_TOKEN -ErrorAction SilentlyContinue
            if ($IsWindows) { & "$PWD\plugin\bin\frontier.cmd" } else { & "$PWD/plugin/bin/frontier" }
            if ($LASTEXITCODE -ne 0) { throw "FAIL: wrapper exited $LASTEXITCODE" }
            Write-Host "PASS: wrapper ran the cached executable"
          } finally {
            Stop-Process -Id $srv.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Diagnostics (always)
        if: always()
        run: |
          Write-Host "--- claude debug log: mod and process lines"
          Get-Content (Join-Path $env:RUNNER_TEMP 'claude-debug.log') -ErrorAction SilentlyContinue | Select-String -Pattern 'frontier|process\.run|rollout' | ForEach-Object { $_.Line.Substring(0, [Math]::Min(300, $_.Line.Length)) } | Select-Object -First 40
          Write-Host "--- gated host log"; Get-Content (Join-Path $env:RUNNER_TEMP 'authsrv.log') -ErrorAction SilentlyContinue
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.os }}${{ matrix.detune && '-detuned' || '' }}
          path: |
            ${{ runner.temp }}/claude-debug.log
            ${{ runner.temp }}/authsrv.log
          if-no-files-found: ignore
